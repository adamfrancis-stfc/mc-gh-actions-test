name: Prod Deploy

on:
  push:
    branches:
      - master
    paths: # Only run when the version number has changed
      - backend/package.json
      - frontend/package.json

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: 'prod-deploy'
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Get release tag
        id: version
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -r '.version' backend/package.json

      - name: Build and push image
        id: build-backend-image
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/deploy.Dockerfile
          push: true
          tags: adamfrancis-stfc/manage-consumables-backend:${{ steps.version.outputs.result }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Get release tag
        id: version
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -r '.version' frontend/package.json

      - name: Build and push image
        id: build-frontend-image
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/deploy.Dockerfile
          push: true
          tags: adamfrancis-stfc/manage-consumables-frontend:${{ steps.version.outputs.result }}
          build-args: BUILD_COMMAND=prod

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Get release tag
        id: version
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -r '.version' backend/package.json

      - name: Update backend image reference
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -i '.spec.template.spec.containers[0].image = "ghcr.io/adamfrancis-stfc/manage-consumables-backend@${{ steps.version.outputs.result }}"' \
              "./backend/kubernetes/prod/deployment.yml"

      - name: Update frontend image reference
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -i '.spec.template.spec.containers[0].image = "ghcr.io/adamfrancis-stfc/manage-consumables-frontend@${{ steps.version.outputs.result }}"' \
              "./frontend/kubernetes/prod/deployment.yml"

      - name: Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./backend/kubernetes/prod/deployment.yml ./frontend/kubernetes/prod/deployment.yml
          git commit -m "chore: update prod deployment version"
          git push

      - name: Publish release
        run: |
          gh release edit "${{ steps.version.outputs.result }}" --draft=false

      - name: Create mergeback PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Mergeback after ${{ steps.version.outputs.result }}" \
            --body "Mergeback after release ${{ steps.version.outputs.result }}." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "master" \
            --label "type:mergeback"