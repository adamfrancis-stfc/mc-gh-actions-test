name: Dev Deploy

on:
  workflow_dispatch:
    inputs:
      sourceBranch:
        description: 'Source branch'
        required: false
        default: 'develop'
        type: string

  push:
    branches:
      - develop
    paths-ignore:
      - README.md
      - .gitignore
      - Release-Notes/**
      - backend/kubernetes/**
      - frontend/kubernetes/**
      - tools/**
      - e2e/**

permissions:
  contents: write
  packages: write

concurrency:
  group: 'dev-deploy'
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build-backend-image.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sourceBranch || 'develop' }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build-backend-image
        uses: docker/build-push-action@v7
        with:
          context: backend/
          file: backend/deploy.Dockerfile
          tags: ghcr.io/adamfrancis-stfc/manage-consumables-backend:dev
          push: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build-frontend-image.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sourceBranch || 'develop' }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build-frontend-image
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          file: frontend/deploy.Dockerfile
          tags: ghcr.io/adamfrancis-stfc/manage-consumables-frontend:dev
          build-args: BUILD_COMMAND=dev
          push: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Update backend image reference
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq e -i '.spec.template.spec.containers[0].image = "ghcr.io/isisbusapps/manage-consumables-backend@${{ needs.backend.outputs.image-digest }}"' \
              "./backend/kubernetes/dev/deployment.yml"

      - name: Update frontend image reference
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq e -i '.spec.template.spec.containers[0].image = "ghcr.io/isisbusapps/manage-consumables-frontend@${{ needs.frontend.outputs.image-digest }}"' \
              "./frontend/kubernetes/dev/deployment.yml"

      - name: Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./backend/kubernetes/dev/deployment.yml ./frontend/kubernetes/dev/deployment.yml
          git commit -m "chore: update dev deployment digests"
          git log
          git push